name: Revalidate MLB Data

# 定時觸發 /api/revalidate，令賽果/排名數據保持最新。
# Vercel Hobby 免費層冇 cron，所以用 GitHub Actions 免費額度。
# 每 2 小時一次（避免同 MLB API 高峰重疊，用 :17 唔用 :00）。
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Next.js revalidation
        run: |
          curl -fsS "https://${SITE}/api/revalidate?secret=${SECRET}"
        env:
          SITE: ${{ vars.SITE_URL }}
          SECRET: ${{ secrets.REVALIDATE_SECRET }}
